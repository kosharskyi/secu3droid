name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:

permissions:
  contents: read

jobs:
  debug-checks:
    name: Debug build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK, run unit tests, and lint
        run: ./gradlew assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-checks
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            app/build/test-results/**

  connected-tests:
    name: Instrumented tests (API 36 x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected instrumentation tests on API 36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: >-
            set -e; mkdir -p artifacts;
            trap 'status=$?; trap - EXIT;
            adb logcat -d -v threadtime > artifacts/logcat.txt 2>&1 || true;
            adb shell dumpsys activity > artifacts/activity-dump.txt 2>&1 || true;
            adb shell dumpsys bluetooth_manager > artifacts/bluetooth-dump.txt 2>&1 || true;
            exit "$status"' EXIT;
            adb shell settings put global hidden_api_policy 1;
            (adb shell cmd bluetooth_manager enable || adb shell svc bluetooth enable);
            for attempt in $(seq 1 30); do if adb shell dumpsys bluetooth_manager | grep -q 'state: ON'; then break; fi; sleep 1; done;
            adb shell dumpsys bluetooth_manager | grep -q 'state: ON' || { echo 'Bluetooth adapter did not reach ON state'; exit 1; };
            ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-instrumented-tests
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/**
            app/build/test-results/**
            app/build/outputs/androidTest-results/**
            app/build/outputs/logs/**
            artifacts/**
