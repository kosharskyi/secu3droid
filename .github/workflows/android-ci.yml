name: Android CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:

permissions:
  contents: read

jobs:
  debug-checks:
    name: Debug build, unit tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.1.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK, run unit tests, and lint
        run: ./gradlew assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: android-debug-checks
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/**
            app/build/test-results/**
